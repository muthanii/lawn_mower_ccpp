# Faculty robot: STUB. Loading this file fails until every TODO is replaced.
#
# Measurements needed from the faculty robot (with how to get them):
#   geometry  - track width B and wheelbase L between wheel centres, wheel
#               radius r (loaded, measured as distance per wheel revolution / 2 pi),
#               tyre width, overall length, width and height (tape measure).
#   inertia   - total operating mass with batteries (scale), mass of one wheel,
#               yaw inertia I_z (bifilar pendulum, or CAD).
#   drive     - gear ratio and wheel max speed (motor datasheet or no-load test),
#               max wheel torque, drivetrain efficiency (battery power vs
#               wheel power on a test run).
#   motor     - motor datasheet (rated current and power are prefilled from
#               the proposal; confirm them on the motor plate).
#   battery   - nominal voltage and capacity (battery label).
#   limits    - max linear and angular speed and accelerations of the
#               controller or firmware.
#   terrain   - on the target grass: rolling resistance mu_r (tow or coast-down
#               test), lateral friction mu_l (turn-in-place power), ICR
#               expansion factor chi (commanded vs measured yaw rate),
#               longitudinal slip s (commanded vs measured speed).
#   electrical- idle power draw of computer, sensors and drivers (power meter).
#   gazebo    - visual meshes if a CAD model exists, else null (box and cylinders).
#
# For every value, add a source key below (e.g. `measured` with the date and
# method) so the paper can cite it.

